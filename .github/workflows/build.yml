name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libglib2.0-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verificar assets presentes en el repo
        run: |
          echo "--- assets/ ---"
          ls -la assets/ || echo "La carpeta assets/ no existe"
          echo "--- data/ ---"
          ls -la data/ || echo "La carpeta data/ no existe"

      - name: Instalar cargo-deb
        run: cargo install cargo-deb

      - name: Build release
        run: cargo build --release

      - name: Generar .deb
        run: cargo deb

      - name: Subir artefacto .deb
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-linux-deb
          path: target/debian/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar pkg-config
        run: choco install pkgconfiglite -y

      - name: Instalar GStreamer (runtime + devel) — descarga directa oficial
        shell: pwsh
        run: |
          $version = "1.28.6"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"

          function Install-GstExe($url, $name) {
            $out = "$env:TEMP\$name.exe"
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                Write-Host "Descargando $name (intento $i de $maxRetries)..."
                Invoke-WebRequest -Uri $url -OutFile $out -TimeoutSec 180
                Write-Host "Descarga de $name completada."
                break
              } catch {
                Write-Host "Fallo en intento $i : $_"
                if ($i -eq $maxRetries) { throw "No se pudo descargar $name tras $maxRetries intentos" }
                Start-Sleep -Seconds 20
              }
            }
            Write-Host "Instalando $name (instalador NSIS, modo silencioso /S)..."
            Start-Process -FilePath $out -ArgumentList "/S" -Wait
            Write-Host "${name}: proceso de instalación finalizado."
          }

          Install-GstExe "$baseUrl/gstreamer-1.0-msvc-x86_64-$version.exe" "gstreamer-runtime"
          Install-GstExe "$baseUrl/gstreamer-1.0-devel-msvc-x86_64-$version.exe" "gstreamer-devel"

          $rutaEsperada = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path $rutaEsperada)) {
            Write-Host "ADVERTENCIA: no se encontró $rutaEsperada. Buscando en otras ubicaciones..."
            Get-ChildItem "C:\" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*gstreamer*" }
          } else {
            Write-Host "Confirmado: GStreamer instalado en $rutaEsperada"
          }

      - name: Localizar instalación real de GStreamer
        shell: pwsh
        run: |
          Write-Host "Buscando glib-2.0.pc en el sistema..."
          $pcFile = Get-ChildItem -Path "C:\gstreamer","C:\Program Files","C:\ProgramData\chocolatey\lib" `
            -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $pcFile) {
            Write-Host "No se encontró glib-2.0.pc. Listando lo que SÍ se instaló para depurar:"
            Get-ChildItem "C:\gstreamer" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 FullName
            Get-ChildItem "C:\ProgramData\chocolatey\lib" -ErrorAction SilentlyContinue | Select-Object Name
            throw "No se pudo localizar glib-2.0.pc en ninguna ruta conocida"
          }

          $pkgConfigDirWin = $pcFile.DirectoryName
          # DirectoryName típico: ...\lib\pkgconfig  ->  root = dos niveles arriba
          $gstRootWin = Split-Path (Split-Path $pkgConfigDirWin -Parent) -Parent

          # Convertir C:\algo\ruta a formato Unix /c/algo/ruta (pkgconfiglite lo requiere así)
          $pkgConfigDirUnix = "/" + $pkgConfigDirWin.Substring(0,1).ToLower() + $pkgConfigDirWin.Substring(2).Replace('\','/')

          Write-Host "Root de GStreamer detectado: $gstRootWin"
          Write-Host "pkgconfig (Unix)          : $pkgConfigDirUnix"

          echo "GST_ROOT_WIN=$gstRootWin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=$pkgConfigDirUnix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$gstRootWin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verificar que pkg-config encuentra glib-2.0
        shell: pwsh
        run: |
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          pkg-config --debug --exists glib-2.0
          pkg-config --modversion glib-2.0

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copiar DLLs necesarias junto al .exe
        shell: pwsh
        run: |
          $out = "target\x86_64-pc-windows-msvc\release"
          Copy-Item pdfium.dll -Destination $out -Force

          $gstBin = "$env:GST_ROOT_WIN\bin"
          Write-Host "Copiando TODAS las DLLs desde: $gstBin"

          # En vez de mantener una lista manual (que siempre termina incompleta:
          # gio, gmodule, orc, pcre2, etc.), copiamos absolutamente todas las
          # DLLs de runtime de GStreamer. Es más pesado pero elimina por completo
          # los errores de "DLL no encontrada" al ejecutar en una PC limpia.
          $dllCount = (Get-ChildItem "$gstBin\*.dll").Count
          Write-Host "Se encontraron $dllCount DLLs en $gstBin"
          Copy-Item "$gstBin\*.dll" -Destination $out -Force

          New-Item -ItemType Directory -Force -Path "$out\lib\gstreamer-1.0" | Out-Null
          $pluginsSrc = "$env:GST_ROOT_WIN\lib\gstreamer-1.0"
          if (Test-Path $pluginsSrc) {
            Copy-Item "$pluginsSrc\*" -Destination "$out\lib\gstreamer-1.0" -Recurse -Force
          } else {
            throw "No se encontraron los plugins de GStreamer en $pluginsSrc"
          }

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir artefacto instalador
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-windows-installer
          path: Output\*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/easy-presenter-linux-deb/*.deb
            artifacts/easy-presenter-windows-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}