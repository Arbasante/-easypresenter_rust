name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libglib2.0-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verificar assets presentes en el repo
        run: |
          echo "--- assets/ ---"
          ls -la assets/ || echo "La carpeta assets/ no existe"
          echo "--- data/ ---"
          ls -la data/ || echo "La carpeta data/ no existe"

      - name: Instalar cargo-deb
        run: cargo install cargo-deb

      - name: Build release
        run: cargo build --release

      - name: Generar .deb
        run: cargo deb

      - name: Subir artefacto .deb
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-linux-deb
          path: target/debian/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar pkg-config
        run: choco install pkgconfiglite -y

      - name: Instalar GStreamer (runtime + devel) via Chocolatey
        shell: pwsh
        run: |
          choco install gstreamer --version=1.26.9 -y --no-progress
          choco install gstreamer-devel --version=1.26.9 -y --no-progress

      - name: Configurar variables de entorno GStreamer
        shell: pwsh
        run: |
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"
          echo "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # pkgconfiglite es una build estilo MSYS/Unix: interpreta ':' como separador
          # de rutas, así que "C:\gstreamer\..." se rompe en "C" + "\gstreamer\...".
          # Hay que pasarle la ruta en formato Unix: /c/gstreamer/...
          $pkgConfigPathUnix = "/c/gstreamer/1.0/msvc_x86_64/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$pkgConfigPathUnix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verificar que pkg-config encuentra glib-2.0
        shell: pwsh
        run: |
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          Get-ChildItem "C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig" -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue
          pkg-config --debug --exists glib-2.0
          pkg-config --modversion glib-2.0

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copiar DLLs necesarias junto al .exe
        shell: pwsh
        run: |
          $out = "target\x86_64-pc-windows-msvc\release"
          Copy-Item pdfium.dll -Destination $out -Force

          $gstBin = "C:\gstreamer\1.0\msvc_x86_64\bin"
          $needed = @(
            "gstreamer-1.0-0.dll","gobject-2.0-0.dll","glib-2.0-0.dll",
            "gstapp-1.0-0.dll","gstvideo-1.0-0.dll","gstbase-1.0-0.dll",
            "gstaudio-1.0-0.dll","intl-8.dll","ffi-7.dll"
          )
          foreach ($dll in $needed) {
            $path = Join-Path $gstBin $dll
            if (Test-Path $path) { Copy-Item $path -Destination $out -Force }
          }

          New-Item -ItemType Directory -Force -Path "$out\lib\gstreamer-1.0" | Out-Null
          Copy-Item "C:\gstreamer\1.0\msvc_x86_64\lib\gstreamer-1.0\*" -Destination "$out\lib\gstreamer-1.0" -Recurse -Force

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir artefacto instalador
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-windows-installer
          path: Output\*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/easy-presenter-linux-deb/*.deb
            artifacts/easy-presenter-windows-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}