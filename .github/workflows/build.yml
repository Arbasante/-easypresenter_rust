name: Compilar EasyPresenter Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1: LINUX → solo .deb
  # ══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libfontconfig1-dev \
            libasound2-dev libsqlite3-dev libunwind-dev \
            libssl-dev pkg-config \
            libgtk-3-dev \
            libdbus-1-dev \
            libxrandr-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Preparar assets para el .deb
        run: |
          mkdir -p assets
          # Si no tienes icono propio, genera uno placeholder
          if [ ! -f assets/icon.png ]; then
            # Instalamos las fuentes dejavu para que ImageMagick tenga con qué escribir
            sudo apt-get install -y imagemagick fonts-dejavu-core
            
            # Forzamos el uso de DejaVu-Sans
            convert -size 256x256 "xc:#0ea5e9" -font DejaVu-Sans -fill white -pointsize 48 \
              -gravity center -annotate 0 "EP" assets/icon.png
          fi
      - name: Compilar (Release)
        run: cargo build --release

      - name: Verificar libpdfium.so disponible para el .deb
        run: |
            ls -la libpdfium.so  # confirma que existe en el repo
            cp libpdfium.so target/release/  # copia al lado del binario también (fallback dev)

      - name: Instalar cargo-deb
        run: cargo install cargo-deb

      - name: Generar .deb
        run: |
          # Guardamos el tag (ej: v1.1.4) en una variable
          TAG_NAME="${{ github.ref_name }}"
          
          # Le recortamos la "v" del principio (queda: 1.1.4)
          CLEAN_VERSION="${TAG_NAME#v}"
          
          # Pasamos la versión limpia a cargo deb
          cargo deb --deb-version "$CLEAN_VERSION"
          cp target/debian/*.deb EasyPresenter-Linux.deb

      - name: Subir .deb como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EasyPresenter-Linux.deb
          path: EasyPresenter-Linux.deb

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: EasyPresenter-Linux.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2: WINDOWS → instalador .exe con Inno Setup
  # ══════════════════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar pkg-config
        run: choco install pkgconfiglite -y

      - name: Instalar GStreamer (runtime + devel)
        shell: pwsh
        run: |
          $ver = "1.24.10"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"

          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile runtime.msi
          Invoke-WebRequest "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile devel.msi

          Start-Process msiexec.exe -ArgumentList "/i runtime.msi /quiet /norestart INSTALLLEVEL=1000" -Wait
          Start-Process msiexec.exe -ArgumentList "/i devel.msi /quiet /norestart INSTALLLEVEL=1000" -Wait

      - name: Configurar variables de entorno GStreamer
        shell: pwsh
        run: |
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"
          echo "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copiar DLLs necesarias junto al .exe
        shell: pwsh
        run: |
          $out = "target\x86_64-pc-windows-msvc\release"
          Copy-Item pdfium.dll -Destination $out -Force

          $gstBin = "C:\gstreamer\1.0\msvc_x86_64\bin"
          $needed = @(
            "gstreamer-1.0-0.dll","gobject-2.0-0.dll","glib-2.0-0.dll",
            "gstapp-1.0-0.dll","gstvideo-1.0-0.dll","gstbase-1.0-0.dll",
            "gstaudio-1.0-0.dll","intl-8.dll","ffi-7.dll"
          )
          foreach ($dll in $needed) {
            $path = Join-Path $gstBin $dll
            if (Test-Path $path) { Copy-Item $path -Destination $out -Force }
          }

          New-Item -ItemType Directory -Force -Path "$out\lib\gstreamer-1.0" | Out-Null
          Copy-Item "C:\gstreamer\1.0\msvc_x86_64\lib\gstreamer-1.0\*" -Destination "$out\lib\gstreamer-1.0" -Recurse -Force

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir artefacto instalador
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-windows-installer
          path: Output\*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/easy-presenter-linux-deb/*.deb
            artifacts/easy-presenter-windows-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
