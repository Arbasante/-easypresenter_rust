name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  # ============================================================
  # LINUX
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # DEPENDENCIAS DEL SISTEMA
      # --------------------------------------------------------
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libfontconfig1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libxkbcommon-x11-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1


      # --------------------------------------------------------
      # RUST
      # --------------------------------------------------------
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable


      # --------------------------------------------------------
      # COMPROBAR ARCHIVOS
      # --------------------------------------------------------
      - name: Verificar archivos del proyecto
        run: |
          echo "=========================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=========================================="

          echo ""
          echo "--- Cargo.toml ---"
          test -f Cargo.toml && echo "OK" || echo "FALTA Cargo.toml"

          echo ""
          echo "--- assets/ ---"
          ls -la assets/ || echo "La carpeta assets/ no existe"

          echo ""
          echo "--- data/ ---"
          ls -la data/ || echo "La carpeta data/ no existe"

          echo ""
          echo "--- build.rs ---"
          test -f build.rs && echo "OK" || echo "FALTA build.rs"


      # --------------------------------------------------------
      # CARGO-DEB
      # --------------------------------------------------------
      - name: Instalar cargo-deb
        run: |
          cargo install cargo-deb


      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------
      - name: Build release Linux
        run: |
          cargo build --release


      # --------------------------------------------------------
      # DEB
      # --------------------------------------------------------
      - name: Generar paquete .deb
        run: |
          cargo deb


      # --------------------------------------------------------
      # SUBIR DEB
      # --------------------------------------------------------
      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error


  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # RUST MSVC
      # --------------------------------------------------------
      - name: Instalar Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc


      # --------------------------------------------------------
      # PKG-CONFIG
      # --------------------------------------------------------
      - name: Instalar pkg-config
        shell: pwsh
        run: |
          Write-Host "Instalando pkg-config..."

          choco install pkgconfiglite -y

          Write-Host ""
          Write-Host "Verificando pkg-config..."

          pkg-config --version

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no quedó disponible."
          }


      # ========================================================
      # GSTREAMER
      # ========================================================
      #
      # GStreamer 1.28.x para Windows usa Inno Setup.
      #
      # Utilizamos 1.28.5.
      #
      # El paquete DEVEL contiene lo necesario para compilar:
      #
      #   - DLLs runtime
      #   - headers
      #   - libraries
      #   - pkg-config files
      #   - plugins
      #
      # ========================================================
      # ========================================================
      # GSTREAMER (DESCARGA CON CACHÉ E INSTALACIÓN)
      # ========================================================

      # 1. Configurar la caché de GitHub
      - name: Caché del instalador de GStreamer
        id: cache-gstreamer
        uses: actions/cache@v4
        with:
          path: C:\gstreamer_cache
          key: gstreamer-1.28.5-msvc-x86_64

      # 2. Descargar SOLO si no se encontró en la caché
      - name: Descargar GStreamer
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "1.28.5"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $url = "$baseUrl/gstreamer-1.0-msvc-x86_64-$version.exe"
          $cacheDir = "C:\gstreamer_cache"
          $installer = "$cacheDir\gstreamer-$version.exe"

          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $maxRetries = 15
          $downloadOK = $false

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Write-Host "Descargando GStreamer (Intento $i de $maxRetries)..."
              
              curl.exe `
                --http1.1 `
                -C - `
                -L `
                --fail `
                --retry 10 `
                --retry-all-errors `
                --retry-delay 5 `
                --connect-timeout 30 `
                --max-time 1200 `
                -o "$installer" `
                "$url"

              if ($LASTEXITCODE -ne 0) { throw "curl terminó con código $LASTEXITCODE" }
              if (-not (Test-Path $installer)) { throw "No se encontró el instalador." }

              $file = Get-Item $installer
              $sizeMB = [math]::Round($file.Length / 1MB, 2)
              
              if ($sizeMB -lt 10) { throw "El archivo es demasiado pequeño." }

              Write-Host "Descarga exitosa ($sizeMB MB)."
              $downloadOK = $true
              break
            }
            catch {
              Write-Host "Error en intento $i: $_"
              if ($i -eq $maxRetries) { throw "Fallo definitivo tras $maxRetries intentos." }
              Start-Sleep -Seconds 15
            }
          }
          if (-not $downloadOK) { throw "La descarga falló." }

      # 3. Instalar (Este paso se ejecuta siempre)
      - name: Instalar GStreamer y configurar entorno
        shell: pwsh
        run: |
          $version = "1.28.5"
          $installer = "C:\gstreamer_cache\gstreamer-$version.exe"
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"

          Write-Host "Instalando desde caché: $installer"

          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/TYPE=devel", "/DIR=$gstRoot")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "El instalador terminó con código $($process.ExitCode)"
          }

          $gstBin = "$gstRoot\bin"
          $gstLib = "$gstRoot\lib"
          $gstInclude = "$gstRoot\include"

          if (-not (Test-Path $gstBin)) { throw "No existe: $gstBin" }

          Write-Host "Buscando glib-2.0.pc..."
          $pcFile = Get-ChildItem -Path $gstRoot -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $pcFile) { throw "No se encontró glib-2.0.pc." }

          $pkgConfigDirWin = $pcFile.DirectoryName
          $pkgConfigDirUnix = "/" + $pkgConfigDirWin.Substring(0, 1).ToLower() + $pkgConfigDirWin.Substring(2).Replace('\', '/')

          "GST_ROOT_WIN=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pkgConfigDirUnix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$gstBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "GStreamer instalado y variables de entorno configuradas."

      # ========================================================
      # VERIFICAR GSTREAMER
      # ========================================================
      - name: Verificar GStreamer y pkg-config
        shell: pwsh
        run: |

          Write-Host "=================================================="
          Write-Host "VERIFICACIÓN GSTREAMER"
          Write-Host "=================================================="


          Write-Host ""
          Write-Host "GST_ROOT_WIN:"
          Write-Host $env:GST_ROOT_WIN


          Write-Host ""
          Write-Host "PKG_CONFIG_PATH:"
          Write-Host $env:PKG_CONFIG_PATH


          Write-Host ""
          Write-Host "pkg-config:"
          pkg-config --version

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no funciona."
          }


          Write-Host ""
          Write-Host "glib-2.0:"
          pkg-config --modversion glib-2.0

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no encuentra glib-2.0."
          }


          Write-Host ""
          Write-Host "gstreamer-1.0:"
          pkg-config --modversion gstreamer-1.0

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no encuentra gstreamer-1.0."
          }


          Write-Host ""
          Write-Host "gstreamer-video-1.0:"
          pkg-config --modversion gstreamer-video-1.0

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no encuentra gstreamer-video-1.0."
          }


          Write-Host ""
          Write-Host "gstreamer-app-1.0:"
          pkg-config --modversion gstreamer-app-1.0

          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config no encuentra gstreamer-app-1.0."
          }


          Write-Host ""
          Write-Host "gst-inspect-1.0:"

          $gstInspect = Get-Command gst-inspect-1.0 `
            -ErrorAction SilentlyContinue

          if (-not $gstInspect) {
            throw "gst-inspect-1.0 no está disponible."
          }

          Write-Host $gstInspect.Source


          Write-Host ""
          Write-Host "Versión GStreamer:"

          gst-inspect-1.0 --version


      # ========================================================
      # BUILD RUST WINDOWS
      # ========================================================
      - name: Build release Windows
        shell: pwsh
        run: |

          Write-Host "=================================================="
          Write-Host "COMPILANDO EASY PRESENTER"
          Write-Host "=================================================="

          cargo build `
            --release `
            --target x86_64-pc-windows-msvc


          if ($LASTEXITCODE -ne 0) {
            throw "Cargo build falló."
          }


          $out = "target\x86_64-pc-windows-msvc\release"


          if (-not (Test-Path $out)) {
            throw "No existe el directorio de release: $out"
          }


          Write-Host ""
          Write-Host "Build completado."


      # ========================================================
      # PREPARAR ARCHIVOS WINDOWS
      # ========================================================
      - name: Copiar DLLs y plugins de GStreamer
        shell: pwsh
        run: |

          $out = "target\x86_64-pc-windows-msvc\release"


          Write-Host "=================================================="
          Write-Host "PREPARANDO APLICACIÓN"
          Write-Host "=================================================="


          # ----------------------------------------------------
          # PDFIUM
          # ----------------------------------------------------

          if (-not (Test-Path "pdfium.dll")) {
            throw "No se encontró pdfium.dll en la raíz del proyecto."
          }

          Copy-Item `
            "pdfium.dll" `
            -Destination $out `
            -Force

          Write-Host "pdfium.dll copiado."


          # ----------------------------------------------------
          # GSTREAMER DLLS
          # ----------------------------------------------------

          $gstBin = "$env:GST_ROOT_WIN\bin"

          if (-not (Test-Path $gstBin)) {
            throw "No existe: $gstBin"
          }


          Write-Host ""
          Write-Host "Buscando DLLs en:"
          Write-Host $gstBin


          $dlls = Get-ChildItem `
            "$gstBin\*.dll" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "DLLs encontradas: $($dlls.Count)"


          if ($dlls.Count -eq 0) {
            throw "No se encontraron DLLs de GStreamer."
          }


          Copy-Item `
            "$gstBin\*.dll" `
            -Destination $out `
            -Force


          Write-Host ""
          Write-Host "DLLs copiadas."


          # ----------------------------------------------------
          # GSTREAMER PLUGINS
          # ----------------------------------------------------

          $pluginsSrc = "$env:GST_ROOT_WIN\lib\gstreamer-1.0"

          $pluginsDst = "$out\lib\gstreamer-1.0"


          if (-not (Test-Path $pluginsSrc)) {
            throw "No se encontraron plugins en: $pluginsSrc"
          }


          New-Item `
            -ItemType Directory `
            -Force `
            -Path $pluginsDst |
            Out-Null


          Write-Host ""
          Write-Host "Copiando plugins..."

          Write-Host "Origen:"
          Write-Host $pluginsSrc

          Write-Host "Destino:"
          Write-Host $pluginsDst


          Copy-Item `
            "$pluginsSrc\*" `
            -Destination $pluginsDst `
            -Recurse `
            -Force


          # ----------------------------------------------------
          # COMPROBAR PLUGINS
          # ----------------------------------------------------

          $pluginFiles = Get-ChildItem `
            $pluginsDst `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "Plugins copiados: $($pluginFiles.Count)"


          if ($pluginFiles.Count -eq 0) {
            throw "No se copiaron plugins de GStreamer."
          }


          # ----------------------------------------------------
          # MOSTRAR ESTRUCTURA
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "ESTRUCTURA FINAL"
          Write-Host "=================================================="


          Write-Host ""
          Write-Host "--- Ejecutable ---"

          Get-Item `
            "$out\easy-presenter-slint.exe" `
            -ErrorAction Stop


          Write-Host ""
          Write-Host "--- DLLs ---"

          Get-ChildItem `
            "$out\*.dll" |
            Select-Object Name, Length


          Write-Host ""
          Write-Host "--- Plugins ---"

          Get-ChildItem `
            $pluginsDst `
            -Recurse `
            -File |
            Select-Object -First 100 FullName


      # ========================================================
      # INNO SETUP
      # ========================================================
      - name: Instalar Inno Setup
        shell: pwsh
        run: |

          Write-Host "Instalando Inno Setup..."

          choco install innosetup -y


          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"


          if (-not (Test-Path $iscc)) {
            throw "No se encontró ISCC.exe."
          }


          Write-Host ""
          Write-Host "Inno Setup encontrado:"
          Write-Host $iscc


      # ========================================================
      # COMPILAR INSTALADOR
      # ========================================================
      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"


          if (-not (Test-Path "installer.iss")) {
            throw "No se encontró installer.iss."
          }


          Write-Host "=================================================="
          Write-Host "COMPILANDO INSTALADOR"
          Write-Host "=================================================="


          & $iscc "installer.iss"


          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup terminó con código $LASTEXITCODE"
          }


          Write-Host ""
          Write-Host "Instalador compilado correctamente."


          if (-not (Test-Path "Output")) {
            throw "No existe la carpeta Output."
          }


          $installers = Get-ChildItem `
            "Output\*.exe" `
            -ErrorAction SilentlyContinue


          if ($installers.Count -eq 0) {
            throw "No se generó ningún instalador."
          }


          Write-Host ""
          Write-Host "Instaladores generados:"

          $installers |
            Select-Object Name, Length


      # ========================================================
      # SUBIR INSTALADOR
      # ========================================================
      - name: Subir instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: easy-presenter-windows-installer
          path: Output\*.exe
          if-no-files-found: error


  # ============================================================
  # RELEASE
  # ============================================================
  release:
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-linux.result == 'success'


    steps:

      # --------------------------------------------------------
      # DESCARGAR ARTEFACTOS
      # --------------------------------------------------------
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      # --------------------------------------------------------
      # MOSTRAR ARTEFACTOS
      # --------------------------------------------------------
      - name: Verificar artefactos
        run: |

          echo "=========================================="
          echo "ARTEFACTOS GENERADOS"
          echo "=========================================="

          find artifacts -type f -print || echo "Advertencia: no se encontraron artefactos (revisa si Windows falló)."


      # --------------------------------------------------------
      # CREAR RELEASE
      # --------------------------------------------------------
      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/easy-presenter-linux-deb/*.deb
            artifacts/easy-presenter-windows-installer/*.exe

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}