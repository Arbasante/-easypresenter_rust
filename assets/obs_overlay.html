<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:sans-serif; }
#contenedor { position:relative; width:100vw; height:100vh; }
#fondo,#fondo-video,#scrim,#capa-texto,#video { position:absolute; inset:0; width:100%; height:100%; }
#fondo,#fondo-video { display:none; object-fit:cover; }
#scrim { background:#000; opacity:0; }
#capa-texto { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; box-sizing:border-box; }
#texto { font-size:48px; font-weight:900; text-align:center; text-shadow:2px 2px 6px #0009; white-space:pre-wrap; }
#referencia { font-size:24px; font-weight:700; text-align:center; margin-top:16px; text-shadow:2px 2px 6px #0009; }
#video { display:none; background:#000; object-fit:contain; z-index:5; }
</style>
</head>
<body>
<div id="contenedor">
  <img id="fondo" alt="">
  <video id="fondo-video" playsinline muted loop></video>
  <div id="scrim"></div>
  <div id="capa-texto"><div id="texto"></div><div id="referencia"></div></div>
  <video id="video" playsinline></video>
</div>
<script>
'use strict';
const texto = document.getElementById('texto');
const referencia = document.getElementById('referencia');
const fondo = document.getElementById('fondo');
const fondoVideo = document.getElementById('fondo-video');
const scrim = document.getElementById('scrim');
const capaTexto = document.getElementById('capa-texto');
const video = document.getElementById('video');
const contenedor = document.getElementById('contenedor');
let imageVersion = -1, videoToken = -1, backgroundToken = -1;
let desiredVideo = null;
let sessionId = null;
let lastPlayAttempt = 0;

function synchronizeVideo() {
  if (!desiredVideo || !desiredVideo.video_activo) return;
  video.loop = !!desiredVideo.video_loop;
  video.muted = !!desiredVideo.video_silenciado;
  const position = Number(desiredVideo.video_posicion) || 0;
  if (video.readyState >= 1 && Number.isFinite(video.duration) &&
      Math.abs(video.currentTime - position) > 1.5) {
    video.currentTime = Math.min(position, video.duration);
  }
  if (desiredVideo.video_pausado) {
    video.pause();
  } else if (video.paused && Date.now() - lastPlayAttempt > 1000) {
    lastPlayAttempt = Date.now();
    video.play().catch(error => console.warn('OBS: no se pudo reproducir el video', error));
  }
}
video.addEventListener('loadedmetadata', synchronizeVideo);

function applyStatus(d) {
  if (sessionId !== d.session_id) {
    sessionId = d.session_id;
    imageVersion = videoToken = backgroundToken = -1;
    video.pause();
    video.removeAttribute('src');
    video.load();
    fondoVideo.pause();
    fondoVideo.removeAttribute('src');
    fondoVideo.load();
  }
  texto.textContent = d.texto || '';
  referencia.textContent = d.referencia || '';
  texto.style.color = referencia.style.color = d.color_texto || '#ffffff';
  desiredVideo = d;
  if (d.video_activo) {
    fondoVideo.pause();
    fondoVideo.style.display = fondo.style.display = 'none';
    scrim.style.opacity = 0;
    capaTexto.style.display = 'none';
    contenedor.style.background = '#000';
    video.style.display = 'block';
    if (d.video_token !== videoToken) {
      video.pause();
      video.src = '/video?v=' + d.video_token;
      videoToken = d.video_token;
      lastPlayAttempt = 0;
      video.load();
    }
    synchronizeVideo();
    return;
  }
  video.pause();
  if (videoToken !== -1) {
    video.removeAttribute('src');
    video.load();
    videoToken = -1;
  }
  video.style.display = 'none';
  capaTexto.style.display = 'flex';
  fondo.style.display = fondoVideo.style.display = 'none';
  scrim.style.opacity = 0;
  contenedor.style.background = 'transparent';
  if (d.fondo_tipo === 'imagen') {
    fondoVideo.pause();
    if (d.fondo_version !== imageVersion) {
      fondo.src = '/fondo?v=' + d.fondo_version;
      imageVersion = d.fondo_version;
    }
    fondo.style.display = 'block';
    fondo.style.objectFit = d.fondo_ajuste || 'cover';
    scrim.style.opacity = d.fondo_opacity || 0;
  } else if (d.fondo_tipo === 'video') {
    if (d.fondo_video_token !== backgroundToken) {
      fondoVideo.src = '/fondo-video?v=' + d.fondo_video_token;
      backgroundToken = d.fondo_video_token;
      fondoVideo.load();
    }
    fondoVideo.style.display = 'block';
    fondoVideo.style.objectFit = d.fondo_ajuste || 'cover';
    fondoVideo.muted = true;
    if (fondoVideo.paused) fondoVideo.play().catch(error => console.warn('OBS: fondo de video', error));
    scrim.style.opacity = d.fondo_opacity || 0;
  } else {
    fondoVideo.pause();
    if (d.fondo_tipo !== 'transparente') contenedor.style.background = d.fondo_color || '#000';
  }
}

async function update() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 3000);
  try {
    const response = await fetch('/status', {cache:'no-store', signal:controller.signal});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    applyStatus(await response.json());
  } catch (error) {
    console.warn('OBS: esperando conexión con ReadyShow', error);
  } finally {
    clearTimeout(timeout);
    setTimeout(update, 250);
  }
}
update();
</script>
</body>
</html>
