[package]
name = "ReadyShow"
version = "0.2.7"
edition = "2024"
build = "build.rs"        

[dependencies]
slint = "1.17.1" # VERSIÓN ACTUALIZADA
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
pdfium-render = "0.8.20"
rayon = "1.10"
image = "0.25"
directories = "5.0"
rfd = "0.14" 
regex = "1"
display-info = "0.4"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
lru = "0.12"
tiny_http = "0.12"
local-ip-address = "0.6"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }



[build-dependencies]
slint-build = "1.17.1" # VERSIÓN ACTUALIZADA
embed-manifest = "1"


# --- CONFIGURACIÓN PARA EL INSTALADOR DE LINUX (.deb) ---
[package.metadata.deb]
name = "ReadyShow"
maintainer = "Arbasante"
copyright = "2026, MIT LICENSE"
extended-description = """
EasyPresenter: Software de presentación multimedia, letras y Biblias 
con soporte de video nativo mediante GStreamer.
"""
depends = "$auto, libgstreamer1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav"
assets = [
    ["target/release/ReadyShow", "usr/bin/ReadyShow", "755"],
    ["data/*.db", "usr/share/ReadyShow/data/", "644"],
    ["assets/ReadyShow.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/ReadyShow.png", "644"],
    ["libpdfium.so", "usr/share/ReadyShow/", "755"]
]